<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NetLedger</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="theme.css"><script defer src="common.js"></script><script defer src="app.js"></script></head><body><header class="topbar"><div><strong>NetLedger</strong><span>Network inventory dashboard</span></div><a href="/">Local demo</a></header><main class="shell"><section class="hero"><p class="badge">IT and networking</p><h1>Track devices, IPs, owners, warranty dates, and incidents.</h1><p>A small IT inventory system for teams that need a clear source of truth.</p></section><section class="grid"><div class="panel"><div class="panel-title"><h2>Devices</h2><span id="online"></span></div><div id="devices" class="list"></div></div><aside class="panel"><form id="deviceForm" class="stack"><h2>Add device</h2><label>Hostname <input name="hostname" required></label><label>IP address <input name="ip" required></label><label>Type <select name="kind"><option>Router</option><option>Switch</option><option>Workstation</option><option>Printer</option><option>NAS</option></select></label><label>Owner <input name="owner"></label><label>Warranty until <input name="warranty_until" type="date"></label><label>Notes <textarea name="notes"></textarea></label><button>Add device</button></form></aside></section><div id="status" class="status" role="status" aria-live="polite"></div></main></body></html>
